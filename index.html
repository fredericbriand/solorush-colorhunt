<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="//fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,100..900&amp;display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="dist/css/index.css" />
    <title>Better Colorhunt</title>
  </head>
  <body>
    <!-- HEADER PART -->
    <header class="flex">
      <div class="logo">
        <a href="/" class="flex">
          <img src="src/assets/img/color-hunt-logo-tongue.svg" alt="" />
          <img src="src/assets/img/color-hunt-logo-face.svg" alt="" />
          <span>Color Hunt</span>
        </a>
      </div>
      <div class="search">
        <input type="text" placeholder="Search palettes..." />
        <i class="search-icon"></i>
      </div>
      <div class="actions">
        <a href="_blank" class="primary-button">
          <i></i>
          <span>Add to Chrome</span>
        </a>
        <button></button>
      </div>
    </header>

    <!-- MAIN PART -->
    <main>
      <!-- CATEGORIES -->
      <nav class="categories">
        <ul class="categories-primary"></ul>
        <ul class="categories-secondary"></ul>
      </nav>

      <!-- PALETTES -->
      <div class="container"></div>

      <!-- ASIDE -->
      <aside></aside>
    </main>
  </body>
</html>
